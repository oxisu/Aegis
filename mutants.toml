# cargo-mutants 配置 —— Aegis 变异测试
#
# 文档：https://mutants.rs
# 运行：
#   cargo mutants --package aegis-core
#   cargo mutants --package aegis-sense
#   cargo mutants                      # 全工作区（较慢）
#
# 为什么需要变异测试：
# 覆盖率只能证明"代码被执行过"，不能证明"断言抓得住错"。
# Aegis 是安全底座，历史上已经有两次教训——
#   1) 默认出口用错度量（跑得通但结果错）
#   2) 指纹把 WFP 伪接口算进去（假漂移）
# 这两类问题的共同点是：测试全绿，行为却是错的。
# 变异测试通过"故意注入 bug，看测试是否红"来直接检验测试的牙齿。

# 只看被测源码，跳过示例、集成测试与构建脚本
examine_globs = ["crates/*/src/**/*.rs"]
exclude_globs = [
    "crates/*/examples/**",
    "crates/*/tests/**",
    "crates/*/build.rs",
]

# 这些变异属于"等价变异"或纯展示性改动，杀不掉也不代表测试有问题：
# - 常量字符串/提示文案：改动不影响安全语义
# - Display 实现的文案
exclude_re = [
    # 版本横幅与展示文案
    "replace .* with \"\"",
    # 等价变异：配对枚举的内层索引起点 `i + 1` 被改成 `i * 1`（== i）后，
    # 只是多了一次"规则与自身比较"——层相同、权重相同、动作必然相同，
    # 永远不满足"动作不同"这个判据，行为完全等价。测试无法也无须捕获。
    "replace \\+ with \\* in verify",
]

# 变异测试需要反复编译，测试用 debug 但关掉调试信息可显著加速
additional_cargo_args = ["--workspace"]

# 时间预算：单个变异体跑测试超过 300s 视为超时（本机 FFI 采集较慢，放宽）
test_timeout = 300
