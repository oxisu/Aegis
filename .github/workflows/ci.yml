name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # 变异测试要反复编译整个 crate（分钟级），不适合每次推送都跑；
  # 因此放在每周一次 + 手动触发。
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Aegis 是 Windows 专属项目（WFP / Windows Service / IP Helper），
# CI 必须跑在 windows 上。
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: 格式与静态检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 格式校验
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  version:
    name: 版本号一致性
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # VERSION 文件与 Cargo.toml 的 workspace 版本必须逐字相同，
      # 否则 aegis-version 打出的版本号会与发布号不一致。
      - name: 校验 VERSION 与 Cargo.toml 一致
        shell: pwsh
        run: |
          $fileVersion = (Get-Content VERSION -Raw).Trim()
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "VERSION     = $fileVersion"
          Write-Host "Cargo.toml  = $cargoVersion"
          if ($fileVersion -ne $cargoVersion) {
            Write-Error "版本号不一致：VERSION='$fileVersion' 与 Cargo.toml='$cargoVersion'"
            exit 1
          }
          # 必须是合法 SemVer（允许预发布标签，不允许 build metadata）
          if ($fileVersion -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "版本号 '$fileVersion' 不是合法 SemVer（Cargo 不接受 build metadata）"
            exit 1
          }
          Write-Host "::notice::Aegis 版本号 $fileVersion"

      # CHANGELOG 必须为当前版本归档了条目
      - name: 校验 CHANGELOG 已归档当前版本
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if (-not (Select-String -Path CHANGELOG.md -Pattern "\[$v\]" -Quiet)) {
            Write-Error "CHANGELOG.md 缺少 [$v] 条目"
            exit 1
          }

  build:
    name: 构建与干跑
    needs: [quality, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史与 tag，构建脚本才会算出正确的 Git 短哈希
          fetch-depth: 0

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 打印完整版本号
        run: cargo run -p aegis-version --example version -- --verbose

      - name: 单测
        run: cargo test --workspace

      - name: 编译全部示例
        run: cargo build --workspace --examples --verbose

      - name: 感知层干跑自检（只读，CI 上仅验证不崩溃）
        run: cargo run -p aegis-sense --example dry_run

      - name: 编排核心只读推演（纯逻辑，验证角色裁决与状态机铁律）
        run: cargo run -p aegis-core --example plan

      # 只做枚举与审计，不添加 / 不修改 / 不删除任何 WFP 对象。
      # GitHub 的 Windows runner 默认具备管理员权限，可完成枚举；
      # 若环境不具备，示例会带错误码与处置建议退出，便于定位。
      - name: WFP 只读勘察（枚举 + 持久背板审计）
        run: cargo run -p aegis-wfp --example wfp_inspect

  # ---------------------------------------------------------------------------
  # 变异回归测试
  #
  # 单测全绿只能证明"代码通过了我们想到的用例"，不能证明"用例真的能
  # 抓住 bug"。变异测试反过来问：往源码里注入一个 bug，测试会不会红？
  # 不会红的那个 bug 就是漏检（missed），对应一块没有真正被守护的逻辑。
  #
  # 对安全底座而言这尤其重要：一条"看起来覆盖了"的状态迁移，如果删掉
  # match arm 测试仍然全绿，那用户真的走到那条边时系统就不会迁移，
  # 而我们会一直以为它是好的。
  # ---------------------------------------------------------------------------
  # 变异测试的总成本 = 变异体总数 × (一次编译 + 一次跑测试)，
  # 单个 runner 上跑完要十几到三十分钟。既然**单机并行是负优化**
  # （cargo 对 target 目录是独占锁，加 -j 只会互相等锁，实测 -j 4 比
  # -j 1 还慢），那就换**机器并行**：把变异体切成 8 份，8 个 runner
  # 同时各跑一份，墙钟时间从"三十分钟"降到"几分钟"。
  #
  # 每个分片独立判定自己那一份的漏检数——任一分片出现漏检就整体失败，
  # 这样阈值语义和单任务时完全一致，不需要跨 job 聚合产物。
  mutation:
    name: 变异回归测试 (${{ matrix.shard }}/${{ matrix.total }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        total: [8]
    env:
      # 允许漏检的变异体数量。基线为 0 —— 新代码必须自带能杀死它的测试。
      MUTATION_MAX_MISSED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: 运行变异测试（分片 ${{ matrix.shard }}/${{ matrix.total }}）
        # -v 是必需的：不带时输出走块缓冲，日志会长时间停在基线那一行，
        # 看起来像挂起（本机实测踩过）。
        # --profile mutants 关掉调试信息，单次编译 7s → 3s，是最大的单项收益。
        # 不开 -j：见 mutants.toml 里的实测数据，单机并行是负优化。
        # 另外不依赖 cargo mutants 自身的退出码语义，改为解析产物目录
        # 自行判定，这样"阈值是多少"这件事只由本文件说了算。
        run: >
          cargo mutants --no-shuffle -v --profile mutants
          --shard ${{ matrix.shard }}/${{ matrix.total }}
          --output mutants.out

      - name: 判定漏检数量
        shell: pwsh
        run: |
          $missed = 0
          if (Test-Path mutants.out/missed.txt) {
            $missed += (Get-Content mutants.out/missed.txt | Where-Object { $_.Trim() }).Count
          }
          $timeout = 0
          if (Test-Path mutants.out/timeout.txt) {
            $timeout += (Get-Content mutants.out/timeout.txt | Where-Object { $_.Trim() }).Count
          }
          Write-Host "漏检变异体 missed = $missed（上限 $env:MUTATION_MAX_MISSED）"
          Write-Host "超时变异体 timeout = $timeout"
          if ($missed -gt [int]$env:MUTATION_MAX_MISSED) {
            Write-Error "漏检 $missed 个变异体，超过上限 $env:MUTATION_MAX_MISSED。请为这些逻辑补充能杀死它们的测试。"
            Get-Content mutants.out/missed.txt
            exit 1
          }
          if ($timeout -gt 0) {
            Write-Error "有 $timeout 个变异体导致测试超时，需提高 mutants.toml 的 test_timeout 或优化测试。"
            exit 1
          }
          Write-Host "::notice::变异测试通过：漏检 $missed / 超时 $timeout"

      - name: 上传变异测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
