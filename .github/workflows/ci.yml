name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 本编排代理是 Windows 专属项目（WFP / Windows Service / IP Helper），
# CI 必须跑在 windows 上。
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: 格式与静态检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 格式校验
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: 构建 aegis-sense
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 编译感知层（含示例）
        run: cargo build -p aegis-sense --examples --verbose

      - name: 干跑自检（只读，CI 上仅验证不崩溃）
        run: cargo run -p aegis-sense --example dry_run
