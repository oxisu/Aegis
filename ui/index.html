<!doctype html>
<html lang="zh-CN" data-theme="aegis">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP：现在还没接 Tauri，先按"纯本地站点"给最小约束。
      接 Tauri 后这一行会被 `tauri.conf.json` 的 csp 接管（两边必须一致，
      否则会出现"dev 能跑、打包后样式和脚本全被拦"）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
    <title>Aegis · 宙斯的神盾</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
