# Aegis —— 宙斯的神盾 · 本地零信任网络编排守护进程
#
# 设计文档（单一事实来源）：design-spec.md
#
# ── 命名约定 ──────────────────────────────────────────────────────────────
# 项目名：Aegis（英文为主）/ 宙斯的神盾（中文为辅）
# 所有 crate 统一使用 `aegis-` 前缀：
#
#   aegis-model        共享数据模型：拓扑事实的类型（零依赖，感知层产出/策略层消费）
#   aegis-sense        感知层：拓扑采集 / 默认出口裁决 / SSID / 拓扑指纹（只读）
#   aegis-core         编排核心：角色模型 / 状态机 / 策略裁决
#   aegis-config       配置加载与 schema 版本校验（纯逻辑，Fail-Closed）
#   aegis-wfp          OS 级底座：WFP Boot-Time 过滤器 / 出站审计
#   aegis-fuse         微秒级网络端口熔断器
#   aegis-audit        审计与证据链落盘（防篡改哈希）
#   aegis-ipc          本地 IPC 协议（命名管道 + token 鉴权）
#   aegis-orchestrator 应用层代理适配器（SPI，可插拔：Clash / sing-box ...）
#   aegisd             守护进程二进制
#   aegisctl           控制端二进制
#
# 分层铁律：`aegis-wfp` 及以上为 OS 级底座，绝不依赖任何应用层代理；
#           `aegis-orchestrator` 只通过 SPI trait 与底座解耦，可整体替换。

[workspace]
resolver = "2"
members = ["crates/*"]
# ⚠ `ui/src-tauri`（GUI 外壳的 Rust 侧）**刻意不进本 workspace**：
#   1. Tauri 要 msvc 工具链，本项目是 gnu 宿主，混进来会让 CI 的
#      「格式与静态检查」（gnu）去编 tauri，第一次就把 CI 搞挂；
#   2. 它有自己的 Cargo.lock（Tauri 依赖树巨大，不该污染后端的锁文件）。
#   它自己声明 `[workspace]` 成为独立根，这里再显式排除一次，双保险。
exclude = ["ui/src-tauri"]

# ── 变异测试专用 profile ──────────────────────────────────────────────────
# cargo-mutants 要为每个变异体单独编译+链接一次测试二进制（163 个变异体 =
# 163 次链接）。Windows 上链接阶段写调试信息是最贵的一步，而变异测试
# 根本不需要调试信息——跑挂了也只会看到"某个断言失败"，不会去调栈。
# 关掉 debuginfo 直接砍掉每个变异体的构建时间。
# 用法：cargo mutants --profile mutants
[profile.mutants]
inherits   = "dev"
debug      = false
incremental = false

# ── 统一版本号：所有 crate 共用，与根目录 VERSION 文件严格一致 ──────────────
# Cargo 的 version 字段不接受 SemVer build metadata（+xxx），
# 因此这里只写到预发布标签；build metadata 由 aegis-version 在运行时追加。
[workspace.package]
version      = "0.1.0-alpha.2"
edition      = "2021"
rust-version = "1.85"
license      = "AGPL-3.0-or-later"
authors      = ["Aegis Contributors"]
description  = "Aegis（宙斯的神盾）：本地零信任网络编排守护进程 —— WFP 绝缘底座 + 可插拔适配器"
# ⚠ 这两个 URL 曾指向不存在的 `aegis-net/aegis`（项目早期占位，一直没改）。
# 它们会被写进 crates.io 的元数据，指错等于把人和 issue 都引到空地。
homepage     = "https://github.com/oxisu/Aegis"
repository   = "https://github.com/oxisu/Aegis"

# ── 可插拔依赖（仅声明版本，具体 features 由各 crate 按需开启，避免全量编译）──
[workspace.dependencies]
# OS 交互底座：WFP / IP Helper / WLAN / SCM / WMI
windows  = { version = "0.58" }
# 拓扑指纹 / 日志防篡改哈希
sha2     = { version = "0.10" }
# 统一错误类型
thiserror = { version = "2" }
# 结构化日志（后续 审计/告警层 使用）
tracing  = { version = "0.1" }
# 序列化：IPC 帧、配置落盘、审计导出均依赖
serde    = { version = "1", features = ["derive"] }
# JSON 解析：目前只有 mihomo 适配器用（它的控制 API 线协议是 JSON）。
# ⚠ 刻意**不**加 reqwest/tokio：那会把几十个 crate 和一个异步运行时拖进来，
#   而控制口在 127.0.0.1 明文，TLS 与 HTTP/2 一个都用不上。
#   详见 crates/aegis-orchestrator/src/clash/http.rs 模块文档。
serde_json = { version = "1" }
# 配置解析：仅 aegis-config 使用
toml     = { version = "1" }
# 变异测试标注：提供 `#[mutants::skip]` 属性（cargo-mutants 官方配套）。
# 只作 dev-dependency，配合 `#[cfg_attr(test, mutants::skip)]` 使用——
# 正式构建里不存在这个 crate，也不会被编进去。
mutants  = { version = "0.0.3" }
# 工作区内部：版本标识（所有 crate 都应依赖它，不要各自读 CARGO_PKG_VERSION）
aegis-version = { path = "crates/aegis-version" }
# 工作区内部：共享数据模型（拓扑事实的类型，零依赖）
#
# ⚠ 依赖方向铁律：策略层（core / config）只依赖 aegis-model，**绝不**依赖
#   aegis-sense。sense 会拉进 `windows` crate，一旦策略层碰它，纯逻辑的
#   增量构建会从 ~3s 涨到 ~22s，而且"策略层可只读干跑"这条就名存实亡了。
aegis-model   = { path = "crates/aegis-model" }
# 工作区内部：感知层（提供拓扑事实）。只有真正要读 Win32 的层才该依赖它
aegis-sense   = { path = "crates/aegis-sense" }
# 工作区内部：编排核心（提供角色模型与状态机）
aegis-core    = { path = "crates/aegis-core" }
# 工作区内部：IPC 帧编解码与版本握手
aegis-ipc     = { path = "crates/aegis-ipc" }
# 工作区内部：配置加载与 schema 校验
aegis-config  = { path = "crates/aegis-config" }
# 工作区内部：OS 级底座（WFP 规则计划与静态自检）
aegis-wfp     = { path = "crates/aegis-wfp" }
# 工作区内部：审计与证据链落盘
aegis-audit   = { path = "crates/aegis-audit" }
# 工作区内部：应用层适配器 SPI（能力接口 + 契约夹具）
aegis-orchestrator = { path = "crates/aegis-orchestrator" }
# 工作区内部：微秒级网口熔断器
aegis-fuse    = { path = "crates/aegis-fuse" }

# ── Release 优化：本机安全底座追求极小体积与快速冷启动 ──
[profile.release]
opt-level     = "z"   # 最小体积
lto           = true  # 链接时优化
codegen-units = 1
panic         = "abort"
strip         = true
