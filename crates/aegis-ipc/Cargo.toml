[package]
name        = "aegis-ipc"
description = "本地 IPC：定长帧编解码 + 版本握手 + 命名管道（显式 DACL）+ 一次性 token 鉴权"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[features]
# ── 可选：把 `Status` 序列化成 JSON（给 GUI 外壳用）──────────────────────
#
# ⚠ 为什么是**可选**的：
#   1. IPC 的文本协议（`key=value`）是刻意选的——人要能直接把状态贴出来看，
#      且不值得为一次状态查询让所有下游都背一个序列化依赖。默认不开。
#   2. GUI 外壳需要把状态交给 JS。若在那边手写一份 JSON 映射，字段就变成
#      两处定义，改一处漏一处不会报错——正是本项目最忌讳的漂移。
#      开这个 feature 让字段**只有一份定义**，序列化由派生保证。
#
# 开它的只有 `ui/src-tauri`（GUI 外壳的 Rust 侧），其余 crate 一律不开。
json = ["serde/derive"]

[dependencies]
# 版本标识：握手时要带上 Aegis 自身版本号
aegis-version = { workspace = true }
thiserror     = { workspace = true }
serde         = { workspace = true }

# Win32：**只有 src/pipe.rs 与 src/token.rs 用得上**
#
#   Security                 —— ConvertStringSecurityDescriptorToSecurityDescriptorW
#                              （SDDL → 安全描述符，建管道时给显式 DACL）
#   Security_Cryptography    —— BCryptGenRandom（token 的随机源）
#   System_Pipes             —— CreateNamedPipeW / ConnectNamedPipe / DisconnectNamedPipe
#   Storage_FileSystem       —— CreateFileW / ReadFile / WriteFile / FlushFileBuffers
#
# ⚠ 帧格式与版本判定一律不碰这些 API —— 它们必须能脱离权限环境被完整测试。
#   Security_Authorization —— SDDL → 安全描述符（不开就没有
#                             ConvertStringSecurityDescriptorToSecurityDescriptorW）
#   System_IO              —— ReadFile / WriteFile / ConnectNamedPipe 的签名里
#                             带 OVERLAPPED，不开这个 feature 它们不会出现在作用域
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    # 对端身份检查：OpenProcess（按 PID 开进程句柄）
    "Win32_System_Threading",
] }

# 刻意不依赖任何序列化库：帧格式必须完全由本项目掌控，
# 不允许外部 crate 的版本升级悄悄改变线上帧布局（IPC 两端版本可能不同）。

[[example]]
name = "ipc_dryrun"
path = "examples/ipc_dryrun.rs"
