[package]
name        = "aegis-wfp"
description = "OS 级底座：WFP 只读状态勘察（枚举过滤器/Provider/子层，审计持久背板）"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[dependencies]
# WFP 需要这几个 feature 才会生成对应绑定：
# WindowsFilteringPlatform 本体；Win32_Security 提供 FWPM_* 结构的 TypeKind/Default；
# Win32_System_Rpc 提供 FwpmEngineOpen0 签名里的 SEC_WINNT_AUTH_IDENTITY_W。
windows = { workspace = true, features = [
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_Rpc",
    # GetSystemDirectoryW：解析系统服务宿主（svchost.exe）的真实路径，
    # 用于 ALE_APP_ID blob。系统盘不一定在 C:，不能拼字符串。
    "Win32_System_SystemInformation",
    "Win32_Foundation",
] }
aegis-version = { workspace = true }
thiserror     = { workspace = true }

[dev-dependencies]
# 只为 `#[cfg_attr(test, mutants::skip)]`：把"必须连上真实 WFP 引擎才跑得到"
# 的胶水函数标出来，避免变异报告里永远挂着几条不可能被捕获的假警报。
# 详见 src/session.rs 模块头的"变异测试怎么对待本模块"。
mutants = { workspace = true }

# 取"默认出口网卡的 LUID"要用感知层——沙漏第二层的规则要钉在具体网卡上。
# 只给 example 用，**不是**正式依赖：底座层本身仍然不认识感知层。
aegis-sense = { workspace = true }

# 刻意不依赖 aegis-core：底座层（OS Level）不关心上层的角色策略，
# 否则"换一套策略"会牵动最靠近内核的那一层。
