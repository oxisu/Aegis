[package]
name        = "aegis-orchestrator"
description = "应用层适配器 SPI：能力接口（Capability）+ 逐能力失败模式 + 契约测试夹具"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[dependencies]
aegis-version = { workspace = true }
thiserror     = { workspace = true }
# mihomo 控制 API 的线协议是 JSON，解析它需要 serde_json。
# ⚠ 只加 serde_json、**不加 reqwest**：控制口在 127.0.0.1 明文，
#   引入 tokio + hyper + TLS 栈换来的能力一个都用不上，却会把
#   同步的 SPI 拖进异步。理由详见 `src/clash/http.rs` 模块文档。
serde       = { workspace = true }
serde_json  = { workspace = true }
# 把连接级元数据翻译成审计事件时，需要消费这两者的类型：
# - aegis-core：`InterfaceRole`（诚实标注"代理侧观测，未知网卡"）
# - aegis-audit：`AuditEvent` / `Action` / `Protocol`（第二审计源的产物）
# ⚠ 依赖方向安全：aegis-core 只依赖 aegis-model（零 Win32），
#   aegis-audit 只依赖 aegis-core + sha2，都不会把 windows crate 拖进本 crate，
#   所以 orchestrator 依旧是纯逻辑、可只读干跑、不碰系统。
aegis-core  = { workspace = true }
aegis-audit = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }

[[example]]
name = "orchestrator_dryrun"
path = "examples/orchestrator_dryrun.rs"
