[package]
name        = "aegis-orchestrator"
description = "应用层适配器 SPI：能力接口（Capability）+ 逐能力失败模式 + 契约测试夹具"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[dependencies]
aegis-version = { workspace = true }
thiserror     = { workspace = true }
# mihomo 控制 API 的线协议是 JSON，解析它需要 serde_json。
# ⚠ 只加 serde_json、**不加 reqwest**：控制口在 127.0.0.1 明文，
#   引入 tokio + hyper + TLS 栈换来的能力一个都用不上，却会把
#   同步的 SPI 拖进异步。理由详见 `src/clash/http.rs` 模块文档。
serde       = { workspace = true }
serde_json  = { workspace = true }

[dev-dependencies]
mutants = { workspace = true }

[[example]]
name = "orchestrator_dryrun"
path = "examples/orchestrator_dryrun.rs"
