[package]
name        = "aegis-sense"
description = "感知层：网络拓扑采集 / 拓扑指纹 / 默认出口裁决（纯只读，绝不注入任何网络策略）"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[dependencies]
# OS 交互：IP Helper（网卡表 / 适配器地址 / 路由） + WLAN（取 SSID）
# 注意：Win32_NetworkManagement_Ndis 必须显式开启。
# windows-rs 把 MIB_IF_TABLE2 / MIB_IF_ROW2 / MIB_IPFORWARD_TABLE2 /
# IP_ADAPTER_ADDRESSES_LH 以及 GetIfTable2 / GetIpForwardTable2 / GetAdaptersAddresses
# 这些依赖 Ndis 类型（NET_LUID_LH、IF_OPER_STATUS 等）的定义用
# #[cfg(feature = "Win32_NetworkManagement_Ndis")] 门控了，
# 只开 IpHelper 的话它们不会出现在作用域里。
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
] }

sha2      = { workspace = true }
thiserror = { workspace = true }
serde     = { workspace = true }

# 数据模型在这里被重导出。上层若只需要类型，请直接依赖 aegis-model，
# 不要依赖本 crate —— 本 crate 会拉进整个 windows crate。
aegis-model = { workspace = true }

# 版本标识：所有对外输出（日志、指纹记录、导出文件）都要带上统一版本号，
# 便于把任何一次采集结果回溯到具体的 Aegis 版本与提交。
aegis-version = { workspace = true }

# 感知层是纯同步的系统信息读取，dry-run 示例同步执行即可
[[example]]
name = "dry_run"
path = "examples/dry_run.rs"
