# =============================================================================
# Aegis 规则集 · 校园网严格模式（"纯洁通道"）
#
# provider name : campus
# behavior      : classical —— payload 每行是一条完整规则 `TYPE,ARGUMENT`
# 消费方        : Clash Verge / mihomo，经 `PUT /providers/rules/campus` 热替换
#
# ⚠ 这份文件**不决定**流量最终怎么处理，它只是一份"命中清单"。
#   真正的动作写在**主配置 rules 链**里（见同目录 README.md）：
#
#       - RULE-SET,campus,DIRECT
#       - FINAL,REJECT              ← 这一句才是"纯洁通道"的定义
#
#   为什么 FINAL 不写进这里：写进来就等于这一个来源独占了裁决权，别的
#   来源再也改不动它——那正是 §20.10 明确不要的"全局优先级链"（每层都
#   有理由认为自己该赢，最后只能靠 Aegis 来仲裁，而无解）。
#
# ⚠ 这套是 **Fail-Closed**：不在清单里的一律拒绝。
#   理由：校园网漏包的代价是**被出口 DPI 审计到**，代价远高于"少上几个
#   网站"。不确定就掐。另一套 hotspot.yaml 是 Fail-Open —— 两边**刻意
#   不对称**，别"顺手对齐"。
#
# ⚠ 这套属于 §20.10 的**第二层（可覆盖策略）**，可以随便改。真正的不变量
#   （默认拒绝、53/LLMNR/mDNS 封锁、回环与 DHCP 放行、拓扑震荡先熔断）
#   在 WFP 层由 `aegis-wfp::plan` 的 `verify()` 管，改坏这份文件破坏不了
#   底线。但反过来要清楚：**把主链的 FINAL,REJECT 改成 FINAL,proxy 等于
#   作废"纯洁通道"**，而这不在任何自动校验的保护范围内。
# =============================================================================

payload:
  # ---------------------------------------------------------------------------
  # 1. 本地链路 —— 不放这些，连校园网认证门户都进不去
  #
  #    ⚠ `aegis-wfp` 在 WFP 层**也**放行回环和 DHCP，但那是**另一层**：
  #      流量一旦进了 TUN，就在这条链上**重新走一遍**。两层各自独立，
  #      任何一层没放行都会断，别指望另一层兜底。
  #
  #    ⚠ 关于 DHCP（67/68 端口）**刻意不放行**：DHCP 在拿到地址时早已完成，
  #      走的是真实网卡，不会进 TUN；而 `DST-PORT,67` 会放行**所有**目的
  #      67 端口的流量，为了一个几乎用不上的场景开一道口子不划算。
  #      同理 NTP（123）也不单独放行——确有需要时见下面第 4 段。
  # ---------------------------------------------------------------------------
  - IP-CIDR,127.0.0.0/8        # 回环：少了它连本机 GUI↔守护进程的 IPC 都可能被掐
  - IP-CIDR6,::1/128           # IPv6 回环
  - IP-CIDR,10.0.0.0/8         # 校园网内网，认证门户常在此
  - IP-CIDR,172.16.0.0/12      # 同上（含 Docker / WSL 虚拟网卡默认网段）
  - IP-CIDR,192.168.0.0/16     # 同上，也是多数路由器管理后台所在
  - IP-CIDR,169.254.0.0/16     # 链路本地：部分学校的认证门户就是从这里跳出来的
  - IP-CIDR6,fe80::/10         # IPv6 链路本地

  # ---------------------------------------------------------------------------
  # 2. 校园网认证门户 —— ⚠ **必须自己填**，不填这套规则会变成"完全不能上网"
  #
  #    现象的欺骗性很强：别的站全部连不上，但 ping 网关是通的——看起来像
  #    "网坏了"或者"Aegis 把网切了"，其实是认证没做。而 REJECT 是**静默
  #    丢包**，不会给任何"你需要先认证"的提示，人的第一反应是去翻防火墙。
  #
  #    填法：连上校园网（先别开这套规则），看跳转到认证页时的地址栏域名，
  #    取其主域名填成后缀匹配。学校有多个认证域就写多行。
  #
  #    （这一条也是本文件为什么需要 `tools/check-rulesets.py`：占位符没被
  #     替换就上线，是最容易发生的静默失败。）
  # ---------------------------------------------------------------------------
  #- DOMAIN-SUFFIX,auth.your-campus.edu.cn   ← 换掉 your-campus 那一段
  #- IP-CIDR,10.0.0.1/32                     ← 认证页给的是裸 IP 时用这个
  #                                          #  （裸 IP 只能用 IP-CIDR，
  #                                          #   DOMAIN 类型只匹配域名）

  # ---------------------------------------------------------------------------
  # 3. 国内白名单 —— 除了本地链路，全部放行能力都在这两行
  #
  #    `GEOSITE,cn` / `GEOIP,CN` 是**务实起点**，不是安全边界：GEOSITE 的
  #    收录标准不是"合规"，GraalVM 的 Realip 库也做不到 IP↔域名的严格绑定。
  #    想要真正的"纯洁"，就把这一段换成你自己审过的教育/科研域名清单——
  #    这是第二层策略，改动不需要 Aegis 同意。
  # ---------------------------------------------------------------------------
  - GEOIP,CN
  - GEOSITE,cn

  # ---------------------------------------------------------------------------
  # 4. 按需取消注释（默认全关，每条都写了代价）
  #
  #    下面每一条都会**扩大**放行面，默认关着；要用请理解代价再开。
  # ---------------------------------------------------------------------------
  #- DOMAIN-SUFFIX,your-campus.edu.cn  # 学校内网办事大厅 / 图书馆资源：
  #                                    # 多数学校这些站**不在** GEOSITE,cn 里，
  #                                    # 不放就是连不上的，属于高概率必填项
  #- DST-PORT,53                      # 仅在关闭了 mihomo 内置 DNS 时才需要。
  #                                   # TUN 模式下 DNS 一般被劫持进 sidecar、
  #                                   # 不走规则链；症状是"网能通但域名解析不了"
  #- DST-PORT,123                     # NTP 校时：TLS 证书的有效期校验依赖系统
  #                                   # 时间，时间错会有"全部 HTTPS 站点不可信"
  #- PROCESS-NAME,svchost.exe         # ⚠ 尽量别用：PROCESS-NAME 在 Windows 上
  #                                   # 会放行该进程的**全部**出站流量，动静太大
