# =============================================================================
# Aegis 规则集 · 热点自由模式（"自由出海通道"）
#
# provider name : hotspot
# behavior      : classical —— payload 每行是一条完整规则 `TYPE,ARGUMENT`
# 消费方        : Clash Verge / mihomo，经 `PUT /providers/rules/hotspot` 热替换
#
# ⚠ 与 campus.yaml 的根本区别：**这份是"排除表"，不是"白名单"**。
#   命中的走 DIRECT，**没命中不在这儿判死刑**——交给主链的 FINAL 出海：
#
#       - RULE-SET,hotspot,DIRECT
#       - FINAL,🚀 节点选择            ← 兜底是"出海"，不是"拒绝"
#
# ⚠ 这套是 **Fail-Open**，与 campus.yaml 的 Fail-Closed **刻意不对称**，
#   别因为"看着不一致"就去对齐。取舍两边是反的：
#   · 校园网漏包 = 被出口 DPI 审计到，代价高 → 不确定就掐（Fail-Closed）
#   · 热点漏包   = 本来就是自由出海通道，代价≈0；
#     而"连不上"的代价是自己没法用网 → 不确定就放行（Fail-Open）
#
# ⚠ Fail-Open **不等于没防护**。§20.10 的第一层不变量是"宪法"，不随场景切换：
#   默认拒绝的底板、回环/DHCP 放行、物理网口对 53 / LLMNR / mDNS 广播的
#   封锁、拓扑震荡先熔断——这些在热点模式下**依然生效**，由 `aegis-wfp`
#   在内核层执行，这份规则集改不动也不需要改。
#   换句话说：这里决定的是"走代理还是直连"，不是"要不要拦"。
# =============================================================================

payload:
  # ---------------------------------------------------------------------------
  # 1. 本地链路 —— 这里的理由跟 campus.yaml 不一样
  #
  #    那边是"不放就连认证门户都进不去"（会被彻底断网）；
  #    这里是"不放的话，连路由器后台 / 打印机 / NAS / 投屏设备都要先绕
  #    地球一圈再从你的代理 IP 回来"，多数情况下直接超时失败。
  #    症状同样具有欺骗性：看起来像"设备坏了"，其实是流量出去回不来。
  # ---------------------------------------------------------------------------
  - IP-CIDR,127.0.0.0/8
  - IP-CIDR6,::1/128
  - IP-CIDR,10.0.0.0/8
  - IP-CIDR,172.16.0.0/12         # Docker / WSL 虚拟网卡默认网段也在这里
  - IP-CIDR,192.168.0.0/16        # 路由器后台 / 大多数家庭内网
  - IP-CIDR,169.254.0.0/16        # 链路本地：投屏与本地发现协议的地盘
  - IP-CIDR6,fe80::/10

  # ---------------------------------------------------------------------------
  # 2. 国内分流 —— 这一段是**优化项，不是必需项**
  #
  #    命中这些就直连，图的是低延迟和不占代理流量。整段注释掉也能跑
  #    （代价是国内站也出海，延迟和流量都不划算）。
  #
  #    放在 hotspot 而不是 campus 的意义在于：两边虽然都写了 GEOIP,CN，
  #    但语义不同——campus 里它是"生路"，这里它只是"抄近道"。
  #    所以 campus 段改动要当安全决策看，这里改动当性能调优看。
  # ---------------------------------------------------------------------------
  - GEOIP,CN
  - GEOSITE,cn

  # ---------------------------------------------------------------------------
  # 3. 按需取消注释
  # ---------------------------------------------------------------------------
  #- DOMAIN-SUFFIX,your-campus.edu.cn  # 人在热点上但要访问学校内网资源时
  #                                    # （多数学校内网不在 GEOSITE,cn 里）
  #- IP-CIDR,<你的家庭内网段>          # 192.168/16 覆盖不到时才需要，
  #                                    # 比如自己划了 10.x 的大内网
  #- DST-PORT,5353                     # ⚠ mDNS（Bonjour / 投屏发现）。
  #                                    # 注意它被 WFP 层锁在物理网口，
  #                                    # 这里放开也只影响进 TUN 之后那段，
  #                                    # 通常不用动
